connection_id: con_dna_snbx_arp_arp_next_gen_atscale_poc_gold
sql: >-
  with currentday AS (

  select max(cast(date_format(reporting_date, 'yyyyMMdd') as bigint)) as
  CurrentReportingDate from
  dna_snbx_arp.arp_next_gen_atscale_poc_gold.reporting_date_fxtest

  )

  select *, case when currentday.CurrentReportingDate = REPORTING_DAY then 1
  else 0 end as IsCurrentReportingDate from (

  select 'Unfiltered' as FilterType, 'Cashflow Currency' as CurrencyType,
    'Discounted+Compounded' as DiscountingType, 
    REPORTING_DAY,
    deal,
    delivery_period,
    payment_date,
    cashflow_type,
    BOOK,
    cashflow_currency,
    coalesce(disc_nv_cc,0) + coalesce(comp_nv_cc,0) AS AMOUNT
  from dna_snbx_arp.arp_next_gen_atscale_poc_gold.fact_finance_fxtest

